<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Caro - Ba Cương vs Quỳnh Anh</title>
<style>
*{box-sizing:border-box} :root{--blue:#1671ee;--pink:#ff3f78;--ink:#172033;--line:#f0cbd8;--soft:#fff7fa}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#ffd8e5 0,#fff7fa 22%,#f7fbff 78%,#dff4db 100%)}.stage{position:relative;width:min(100vw,100vh);min-width:320px;aspect-ratio:1/1;margin:auto;overflow:hidden;background:linear-gradient(180deg,#ffd7e4 0 13%,#fff 37% 83%,#eaf8ff 83% 91%,#dff4cb 91%);box-shadow:0 0 40px #c83b6e16}.spark{position:absolute;z-index:0;font-size:clamp(16px,2vw,28px);filter:drop-shadow(0 2px 2px #fff)}.s1{left:15%;top:4%;color:#ffbd42}.s2{right:16%;top:6%;color:#ff73a2}.s3{right:7%;top:47%;color:#ff8daf}.s4{left:7%;top:69%;color:#52b6ff}.cloud{position:absolute;width:9%;height:3%;background:#fff;border-radius:999px;opacity:.8;box-shadow:20px -7px 0 2px #fff,-16px -5px 0 0 #fff}.c1{left:8%;top:10%}.c2{right:10%;top:11%}.header{position:relative;z-index:2;height:13%;display:flex;align-items:center;justify-content:center}.title{text-align:center}.title h1{margin:0;font-size:clamp(28px,5vw,64px);font-weight:1000;line-height:.95;letter-spacing:.02em}.title .blue{color:#189be7;text-shadow:0 3px 0 #fff}.title .pink{color:#ff477e;text-shadow:0 3px 0 #fff}.title p{margin:.45em 0 0;font-weight:800;font-size:clamp(10px,1.4vw,18px);color:#25518a}.corner{position:absolute;top:2%;z-index:3;border:1px solid #f6b9ca;background:#fffdfd;border-radius:12px;padding:.65em .9em;font-weight:800;font-size:clamp(9px,1.1vw,14px);box-shadow:0 5px 12px #d94c7d18}.corner.left{left:2%}.corner.right{right:2%}.controls{position:relative;z-index:3;margin:0 1.8%;height:20%;border:1.5px solid #f0b9ca;border-radius:16px;background:#fffffff2;box-shadow:0 4px 12px #dd7b9b1f;overflow:hidden}.control-row{display:grid;grid-template-columns:1fr 1.35fr 1fr;height:58%;align-items:center}.group{height:72%;display:flex;flex-direction:column;justify-content:center;padding:0 4%}.group+.group{border-left:1px solid #f1d4dd}.label{text-align:center;font-size:clamp(8px,1vw,13px);font-weight:950;margin-bottom:.55em}.options{display:flex;justify-content:center;gap:4%;flex-wrap:wrap}.option{border:1px solid #efc7d3;background:#fff;border-radius:10px;padding:.6em 1.05em;font-size:clamp(8px,.95vw,13px);font-weight:900;cursor:pointer;color:#222;white-space:nowrap}.option.active{background:linear-gradient(180deg,#ff4a80,#ff2f69);border-color:#ff3b74;color:#fff;box-shadow:0 4px 10px #ff3f7830}.second{height:42%;display:grid;grid-template-columns:1fr 1.35fr 1fr;border-top:1px solid #f3d8e0;align-items:center}.starterWrap{grid-column:1/2;text-align:center}.status{grid-column:2/3;justify-self:center;min-width:72%;padding:.65em 1em;text-align:center;background:#fff;border:1px solid #efcfda;border-radius:12px;font-size:clamp(10px,1.3vw,18px);font-weight:1000}.x{color:var(--blue)}.o{color:var(--pink)}.gamearea{position:relative;z-index:2;height:61%;display:grid;grid-template-columns:21% 58% 21%;align-items:center;padding-top:1%}.side{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2%}.sideTop{display:flex;align-items:center;justify-content:center;gap:8%;width:100%}.avatar{width:42%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--blue);background:#fff;box-shadow:0 5px 12px #17203325}.right .avatar{border-color:#ef2d42}.mark{font-size:clamp(24px,4vw,52px);font-weight:1000}.score{margin-top:5%;width:72%;padding:7% 4%;border-radius:16px;background:#fff;border:2px solid #8fc0ff;text-align:center;box-shadow:0 5px 14px #4c8ee51a}.right .score{border-color:#ff9db6;background:#fff6f9}.score .num{display:block;font-size:clamp(24px,4vw,52px);font-weight:1000;line-height:1}.score .caption{font-size:clamp(9px,1.1vw,14px);font-weight:900;margin-top:.25em}.bubble{margin-top:8%;width:80%;padding:7% 5%;background:#fff9e7;border:2px solid #ffd66c;border-radius:16px;text-align:center;font-weight:900;color:#2769ba;font-size:clamp(9px,1.15vw,15px);transform:rotate(-3deg);box-shadow:0 4px 10px #e8ad3918}.dino{margin-top:6%;font-size:clamp(48px,8vw,100px);filter:drop-shadow(0 7px 4px #4da9db25)}.quynhFun{position:relative;margin-top:7%;width:74%;aspect-ratio:1}.quynhFun img.face{position:absolute;left:8%;top:9%;width:84%;height:84%;object-fit:cover;border-radius:24px;border:4px solid #fff;box-shadow:0 6px 18px #ef4f8230}.quynhFun .crown{position:absolute;width:37%;right:-1%;top:-2%;transform:rotate(12deg)}.heart{position:absolute;font-size:clamp(17px,2.5vw,34px);color:#ff4e86;filter:drop-shadow(0 2px 1px white)}.h1{right:-5%;top:27%}.h2{left:-8%;bottom:8%}.rainbow{position:absolute;right:-10%;bottom:-5%;font-size:clamp(28px,4.5vw,60px)}.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.board{display:grid;width:96%;aspect-ratio:1;background:#efccd7;border:2px solid #e9b8c7;border-radius:15px;overflow:hidden;gap:1px;box-shadow:0 6px 16px #c8406b12}.cell{border:0;background:#fff;display:grid;place-items:center;padding:3px;cursor:pointer;min-width:0;min-height:0}.cell:hover:not(:disabled){background:#fff7fa}.cell:disabled{cursor:default}.piece{width:76%;height:76%;object-fit:cover;border-radius:50%;border:2px solid var(--blue);box-shadow:0 2px 5px #17203325}.piece.o{border-color:#ef334e}.cell.win{background:#fff0a9}.actions{margin-top:2.5%;display:flex;gap:4%;justify-content:center;align-items:center;width:100%}.btn{border:0;border-radius:13px;padding:.72em 1.8em;font-size:clamp(9px,1.15vw,15px);font-weight:950;cursor:pointer}.primary{background:linear-gradient(180deg,#ff4f83,#ff326c);color:#fff;box-shadow:0 5px 12px #ff3f7830}.secondary{background:#fff;border:1px solid #edc8d4;color:#333}.info{margin-top:1%;font-size:clamp(7px,.75vw,11px);color:#6b7280}.footerbar{position:absolute;left:2%;right:2%;bottom:1.5%;z-index:4;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.footerbar button{pointer-events:auto}.sound{border:1px solid #eccbd6;background:#fff;border-radius:12px;padding:.65em 1em;font-weight:850;font-size:clamp(8px,1vw,13px);box-shadow:0 4px 10px #c2537815}.resetScores{border:1px solid #eccbd6;background:#fff;border-radius:12px;padding:.6em .9em;font-weight:800;font-size:clamp(7px,.9vw,12px)}@media(max-width:720px){body{background:#fff}.stage{width:100vw;height:auto;min-height:100vh;aspect-ratio:auto;overflow:visible}.header{height:auto;padding:14px 0 10px}.controls{height:auto}.control-row,.second{height:auto;grid-template-columns:1fr}.group{padding:9px 6px}.group+.group{border-left:0;border-top:1px solid #f1d4dd}.second{padding:8px}.starterWrap,.status{grid-column:1}.status{margin-top:8px}.gamearea{height:auto;display:grid;grid-template-columns:1fr 1fr;padding:10px}.center{grid-column:1/-1;grid-row:1}.left{grid-column:1;grid-row:2}.right{grid-column:2;grid-row:2}.side{padding-top:10px}.avatar{width:74px}.score{width:120px;padding:8px}.bubble,.dino,.quynhFun{display:none}.board{width:min(94vw,620px)}.footerbar{position:relative;left:auto;right:auto;bottom:auto;padding:10px}.corner{display:none}}
</style></head><body><main class="stage"><div class="spark s1">★</div><div class="spark s2">♥</div><div class="spark s3">★</div><div class="spark s4">✦</div><div class="cloud c1"></div><div class="cloud c2"></div><button class="corner left">☀️ Chủ đề</button><button class="corner right">❔ Hướng dẫn</button><header class="header"><div class="title"><h1><span class="blue">⭐ CỜ</span> <span class="pink">CARO ⭐</span></h1><p>Chơi vui vẻ và rèn luyện tư duy!</p></div></header><section class="controls"><div class="control-row"><div class="group"><div class="label">LUẬT THẮNG</div><div class="options"><button class="option rule active" data-v="3">3 QUÂN</button><button class="option rule" data-v="5">5 QUÂN</button></div></div><div class="group"><div class="label">KÍCH THƯỚC BÀN CỜ</div><div class="options"><button class="option grid" data-v="3">3×3</button><button class="option grid active" data-v="7">7×7</button><button class="option grid" data-v="10">10×10</button><button class="option grid" data-v="15">15×15</button></div></div><div class="group"><div class="label">ĐỐI THỦ</div><div class="options"><button class="option opponent active" data-v="human">2 NGƯỜI</button><button class="option opponent" data-v="computer">VỚI MÁY</button></div></div></div><div class="second"><div class="starterWrap"><div class="label">AI ĐI TRƯỚC?</div><div class="options"><button class="option starter active" data-v="X">X (Ba Cương)</button><button class="option starter" data-v="O">O (Quỳnh Anh)</button></div></div><div id="status" class="status"></div></div></section><section class="gamearea"><aside class="side left"><div class="sideTop"><img class="avatar" src="assets/player-x.svg" alt="Ba Cương"><span class="mark x">X</span></div><div class="score"><span class="num x">★ <b id="scoreX">0</b></span><div class="caption">sao<br><span class="x">(Ba Cương)</span></div></div><div class="bubble">🔊 Tới lượt<br><strong>ba Cương</strong></div><div class="dino">🦕</div></aside><div class="center"><div id="board" class="board"></div><div class="actions"><button id="reset" class="btn primary">↻ &nbsp; CHƠI LẠI</button></div><div id="info" class="info"></div></div><aside class="side right"><div class="sideTop"><span class="mark o">O</span><img class="avatar" src="assets/player-o.svg" alt="Quỳnh Anh"></div><div class="score"><span class="num o">★ <b id="scoreO">999</b></span><div class="caption">sao<br><span class="o">(Quỳnh Anh)</span></div></div><div class="quynhFun"><img class="face" src="assets/player-o.svg" alt="Quỳnh Anh vui nhộn"><img class="crown" src="assets/quynh-crown.svg" alt=""><span class="heart h1">♥</span><span class="heart h2">♥</span><span class="rainbow">🌈</span></div></aside></section><div class="footerbar"><button id="soundBtn" class="sound">🔇 Âm thanh</button><button id="clearScore" class="resetScores">🗑 Xóa điểm<br><small>Mặc định: 0 / 999 ⭐</small></button></div></main><script>
const XIMG='assets/player-x.svg',OIMG='assets/player-o.svg',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const boardEl=$('#board'),statusEl=$('#status'),infoEl=$('#info'),scoreXEl=$('#scoreX'),scoreOEl=$('#scoreO'),soundBtn=$('#soundBtn');let winLength=3,size=7,opponent='human',starter='X',board=[],current='X',playing=true,winning=[],thinking=false,soundOn=false,scores={X:0,O:999};function select(c,v){$$('.'+c).forEach(b=>b.classList.toggle('active',b.dataset.v==v))}function say(t){if(!soundOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.93;speechSynthesis.speak(u)}function speakTurn(){if(!playing||thinking)return;say(current==='X'?'Tới lượt ba Cương':'Tới lượt Quỳnh Anh')}function updateScores(){scoreXEl.textContent=scores.X;scoreOEl.textContent=scores.O}function start(announce=true){if(size<winLength){size=winLength;select('grid',size)}board=Array(size*size).fill('');current=starter;playing=true;winning=[];thinking=false;boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;update();render();if(opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,350)}else if(announce)speakTurn()}function update(){if(playing)statusEl.innerHTML=opponent==='computer'&&current==='O'?'🤖 Máy đang nghĩ...':`Lượt của: <span class="${current==='X'?'x':'o'}">${current} (${current==='X'?'Ba Cương':'Quỳnh Anh'})</span>`;infoEl.textContent=`Bàn ${size}×${size} · Xếp ${winLength} quân liên tiếp để thắng`}function render(){boardEl.innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(winning.includes(i)?' win':'');if(v){let im=document.createElement('img');im.src=v==='X'?XIMG:OIMG;im.className='piece'+(v==='O'?' o':'');im.alt=v;b.appendChild(im)}b.disabled=!playing||thinking||!!v||(opponent==='computer'&&current==='O');b.onclick=()=>humanMove(i);boardEl.appendChild(b)})}function humanMove(i){if(!playing||thinking||board[i]||(opponent==='computer'&&current==='O'))return;place(i,current);if(playing&&opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,300)}}function place(i,p){board[i]=p;winning=findWin(i,p);if(winning.length){playing=false;scores[p]++;updateScores();statusEl.textContent=p==='X'?'🎉 Ba Cương thắng!':'🎉 Quỳnh Anh thắng!';if(p==='O')say(`Xiuuuuuuuuuuuuu con thắng rồi, con được ${scores.O} sao`);else say(`Yeahh Ba thắng rồi, ba được ${scores.X} sao`)}else if(board.every(Boolean)){playing=false;statusEl.textContent='🤝 Hòa!'}else{current=p==='X'?'O':'X';update();setTimeout(speakTurn,90)}render()}function computerMove(){if(!playing)return;let m=immediate('O')??immediate('X');if(m==null)m=(size===3&&winLength===3)?miniMove():heuristic();thinking=false;if(m!=null)place(m,'O')}function immediate(p){for(let i=0;i<board.length;i++)if(!board[i]){board[i]=p;let w=findWin(i,p).length;board[i]='';if(w)return i}return null}function miniMove(){let best=-99,a=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';let s=minimax(false);board[i]='';if(s>best){best=s;a=[i]}else if(s===best)a.push(i)}return a[Math.floor(Math.random()*a.length)]}function minimax(max){let r=eval3();if(r!==null)return r;let best=max?-99:99;for(let i=0;i<9;i++)if(!board[i]){board[i]=max?'O':'X';let s=minimax(!max);board[i]='';best=max?Math.max(best,s):Math.min(best,s)}return best}function eval3(){for(let p of ['X','O'])for(let i=0;i<9;i++)if(board[i]===p&&findWin(i,p).length)return p==='O'?10:-10;return board.every(Boolean)?0:null}function heuristic(){let c=[];for(let i=0;i<board.length;i++)if(!board[i]&&neighbor(i))c.push(i);if(!c.length)return Math.floor(size/2)*size+Math.floor(size/2);let best=-Infinity,a=[];for(let i of c){let s=score(i,'O')*1.12+score(i,'X');if(s>best){best=s;a=[i]}else if(s===best)a.push(i)}return a[Math.floor(Math.random()*a.length)]}function neighbor(i){let r=Math.floor(i/size),c=i%size;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc])return true}return false}function score(i,p){let r=Math.floor(i/size),c=i%size,t=0;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1,o=0;for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){n++;rr+=dr*sg;cc+=dc*sg}if(rr>=0&&rr<size&&cc>=0&&cc<size&&!board[rr*size+cc])o++}t+=Math.pow(8,n)+o*n*6}return t}function findWin(i,p){let r=Math.floor(i/size),c=i%size;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let line=[i];for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){sg<0?line.unshift(rr*size+cc):line.push(rr*size+cc);rr+=dr*sg;cc+=dc*sg}}if(line.length>=winLength){let pos=line.indexOf(i),st=Math.max(0,pos-winLength+1);if(st+winLength>line.length)st=line.length-winLength;return line.slice(st,st+winLength)}}return []}$$('.opponent').forEach(b=>b.onclick=()=>{opponent=b.dataset.v;select('opponent',opponent);start()});$$('.rule').forEach(b=>b.onclick=()=>{winLength=+b.dataset.v;select('rule',winLength);if(size<winLength)size=winLength;start()});$$('.grid').forEach(b=>b.onclick=()=>{let n=+b.dataset.v;if(n<winLength)return;size=n;select('grid',size);start()});$$('.starter').forEach(b=>b.onclick=()=>{starter=b.dataset.v;select('starter',starter);start()});$('#reset').onclick=()=>start();$('#clearScore').onclick=()=>{scores={X:0,O:999};updateScores();start(false)};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Âm thanh ON':'🔇 Âm thanh';if(soundOn)speakTurn();else if('speechSynthesis'in window)speechSynthesis.cancel()};updateScores();start(false);
</script></body></html>
