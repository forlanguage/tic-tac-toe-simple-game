<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Caro</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;font-family:system-ui,-apple-system,sans-serif;background:#f4f6fb;color:#172033}.game{width:min(96vw,580px);background:#fff;padding:22px;border-radius:22px;box-shadow:0 16px 45px #17203318;text-align:center}h1{margin:0 0 4px;font-size:clamp(1.7rem,5vw,2.2rem)}.sub{margin:0 0 12px;color:#747c90}.label{font-size:.78rem;font-weight:800;color:#8a91a3;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}.picker{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:auto;max-width:430px;background:#f0f3f8;padding:5px;border-radius:13px}.pick{border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:750;color:#667085;cursor:pointer}.pick.active{background:#fff;color:#172033;box-shadow:0 2px 8px #17203318}.status{font-weight:800;margin:13px 0}.board-wrap{width:100%;overflow:auto;display:flex;justify-content:center}.board{display:grid;aspect-ratio:1;width:min(100%,520px);background:#d6dbe6;border:2px solid #d6dbe6;gap:1px;border-radius:10px;overflow:hidden;touch-action:manipulation}.cell{border:0;background:#fff;display:grid;place-items:center;font-weight:900;cursor:pointer;user-select:none;color:#315efb;padding:0;min-width:0}.cell.o{color:#ef4b45}.cell.win{background:#fff3b8}.cell:disabled{cursor:default}.actions{margin-top:15px}#reset{border:0;border-radius:999px;padding:11px 24px;font-weight:800;background:#172033;color:#fff;cursor:pointer}footer{margin-top:12px;font-size:.82rem;color:#8a91a3}@media(max-width:430px){body{padding:8px}.game{padding:16px 9px}.pick{font-size:.82rem;padding:8px 3px}}
</style></head><body><main class="game"><h1>⭕ Cờ Caro ❌</h1><p class="sub">Chọn kiểu chơi và kích thước bàn cờ</p>
<div class="label">Đối thủ</div><div class="picker"><button class="pick opponent active" data-v="human">👥 2 người</button><button class="pick opponent" data-v="computer">🤖 Với máy</button></div>
<div class="label">Luật thắng</div><div class="picker"><button class="pick rule active" data-v="3">3 quân</button><button class="pick rule" data-v="5">5 quân</button></div>
<div class="label">Kích thước bàn</div><div class="picker grid-picker"><button class="pick grid" data-v="3">3×3</button><button class="pick grid active" data-v="7">7×7</button><button class="pick grid" data-v="10">10×10</button><button class="pick grid" data-v="15">15×15</button></div>
<div id="status" class="status"></div><div class="board-wrap"><div id="board" class="board"></div></div><div class="actions"><button id="reset">Chơi lại</button></div><footer id="info"></footer></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],boardEl=$('#board'),statusEl=$('#status'),infoEl=$('#info');
let winLength=3,size=7,opponent='human',board=[],current='X',playing=true,winning=[],thinking=false;
function select(cls,val){$$('.'+cls).forEach(b=>b.classList.toggle('active',b.dataset.v==val))}
function start(){if(size<winLength){size=winLength;select('grid',size)}board=Array(size*size).fill('');current='X';playing=true;winning=[];thinking=false;boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;update();render()}
function update(){if(playing)statusEl.textContent=opponent==='computer'?(current==='X'?'Lượt của bạn (X)':'🤖 Máy đang nghĩ...'):`Lượt của ${current}`;infoEl.textContent=`Bàn ${size}×${size} · Xếp ${winLength} quân liên tiếp để thắng`}
function render(){boardEl.innerHTML='';const fs=size<=3?'clamp(2.8rem,14vw,5rem)':size<=7?'clamp(1.5rem,7vw,2.7rem)':size<=10?'clamp(1rem,5vw,1.8rem)':'clamp(.75rem,3.5vw,1.25rem)';board.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(v==='O'?' o':'')+(winning.includes(i)?' win':'');b.textContent=v;b.style.fontSize=fs;b.disabled=!playing||thinking||!!v||(opponent==='computer'&&current==='O');b.onclick=()=>humanMove(i);boardEl.appendChild(b)})}
function humanMove(i){if(!playing||thinking||board[i]||(opponent==='computer'&&current==='O'))return;place(i,current);if(playing&&opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,220)}}
function place(i,p){board[i]=p;winning=findWin(i,p);if(winning.length){playing=false;statusEl.textContent=opponent==='computer'?(p==='X'?'🎉 Bạn thắng!':'🤖 Máy thắng!'):`🎉 ${p} thắng!`}else if(board.every(Boolean)){playing=false;statusEl.textContent='🤝 Hòa!'}else{current=p==='X'?'O':'X';update()}render()}
function computerMove(){if(!playing)return;let m=immediate('O')??immediate('X');if(m==null)m=(size===3&&winLength===3)?miniMove():heuristic();thinking=false;if(m!=null)place(m,'O')}
function immediate(p){for(let i=0;i<board.length;i++)if(!board[i]){board[i]=p;let w=findWin(i,p).length;board[i]='';if(w)return i}return null}
function miniMove(){let best=-99,arr=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';let s=minimax(false);board[i]='';if(s>best){best=s;arr=[i]}else if(s===best)arr.push(i)}return arr[Math.floor(Math.random()*arr.length)]}
function minimax(max){let r=eval3();if(r!==null)return r;let best=max?-99:99;for(let i=0;i<9;i++)if(!board[i]){board[i]=max?'O':'X';let s=minimax(!max);board[i]='';best=max?Math.max(best,s):Math.min(best,s)}return best}
function eval3(){for(let p of ['X','O'])for(let i=0;i<9;i++)if(board[i]===p&&findWin(i,p).length)return p==='O'?10:-10;return board.every(Boolean)?0:null}
function heuristic(){let cand=[];for(let i=0;i<board.length;i++)if(!board[i]&&neighbor(i))cand.push(i);if(!cand.length)return Math.floor(size/2)*size+Math.floor(size/2);let best=-Infinity,a=[];for(let i of cand){let s=score(i,'O')*1.12+score(i,'X');if(s>best){best=s;a=[i]}else if(s===best)a.push(i)}return a[Math.floor(Math.random()*a.length)]}
function neighbor(i){let r=Math.floor(i/size),c=i%size;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc])return true}return false}
function score(i,p){let r=Math.floor(i/size),c=i%size,t=0;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1,o=0;for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){n++;rr+=dr*sg;cc+=dc*sg}if(rr>=0&&rr<size&&cc>=0&&cc<size&&!board[rr*size+cc])o++}t+=Math.pow(8,n)+o*n*6}return t}
function findWin(i,p){let r=Math.floor(i/size),c=i%size;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let line=[i];for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){sg<0?line.unshift(rr*size+cc):line.push(rr*size+cc);rr+=dr*sg;cc+=dc*sg}}if(line.length>=winLength){let pos=line.indexOf(i),st=Math.max(0,pos-winLength+1);if(st+winLength>line.length)st=line.length-winLength;return line.slice(st,st+winLength)}}return []}
$$('.opponent').forEach(b=>b.onclick=()=>{opponent=b.dataset.v;select('opponent',opponent);start()});$$('.rule').forEach(b=>b.onclick=()=>{winLength=+b.dataset.v;select('rule',winLength);if(size<winLength)size=winLength;start()});$$('.grid').forEach(b=>b.onclick=()=>{let n=+b.dataset.v;if(n<winLength)return;size=n;select('grid',size);start()});$('#reset').onclick=start;start();
</script></body></html>
