<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Caro - Ba Cương vs Quỳnh Anh</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:radial-gradient(circle at 7% 60%,#e9f5ff 0 7%,transparent 7.2%),radial-gradient(circle at 94% 58%,#fff0f6 0 8%,transparent 8.2%),linear-gradient(180deg,#fff7fa,#fff 45%,#f6fbff)}button{font:inherit}.app{width:min(1320px,97vw);margin:auto;padding:14px 0 22px}.top{display:grid;grid-template-columns:150px 1fr 150px;align-items:start}.title{text-align:center}.title h1{margin:0;font-size:clamp(2.4rem,5vw,4.6rem);line-height:1;font-weight:1000;letter-spacing:.02em}.title .blue{color:#2997eb}.title .pink{color:#ff477d}.title p{margin:6px 0 12px;color:#475569;font-weight:650}.ghost{border:1px solid #ffc4d6;background:#fff;border-radius:14px;padding:12px 14px;font-weight:800;color:#ff477d;box-shadow:0 5px 14px #ff477d12;cursor:pointer}.controls{border:1px solid #ffd0dd;border-radius:18px;background:#ffffffdb;box-shadow:0 8px 24px #ff6b9a12;overflow:hidden}.main-controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;padding:12px}.sub-controls{border-top:1px solid #f5d9e2;padding:11px;display:flex;justify-content:center}.group{padding:0 15px}.group+.group{border-left:1px solid #e6eaf0}.label{text-align:center;font-size:.82rem;font-weight:950;margin-bottom:8px}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.option{border:1px solid #d9dee7;background:#fff;border-radius:11px;padding:10px 17px;font-weight:850;cursor:pointer;min-width:76px;transition:.15s}.option:hover{transform:translateY(-1px)}.option.active{background:linear-gradient(135deg,#ff3f76,#ff5b92);border-color:#ff3f76;color:#fff;box-shadow:0 5px 12px #ff477d30}.starter.active[data-v="X"]{background:#1771ea;border-color:#1771ea}.arena{display:grid;grid-template-columns:220px minmax(380px,720px) 260px;gap:18px;justify-content:center;align-items:start;margin-top:18px}.side{text-align:center}.player-head{display:flex;align-items:center;justify-content:center;gap:12px;font-size:2.7rem;font-weight:1000}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #1771ea;box-shadow:0 6px 18px #17203322}.side-o .avatar{border-color:#f13255}.x{color:#1771ea}.o{color:#ee334f}.score{margin:16px auto 12px;width:170px;border-radius:18px;background:#fff;padding:14px 10px;border:2px solid #9fc9ff;box-shadow:0 7px 18px #1771ea15}.side-o .score{border-color:#ffb3c4;background:#fff9fb}.score .big{font-size:2.45rem;font-weight:1000;line-height:1}.score .star{font-size:2rem}.score small{display:block;margin-top:6px;font-weight:800;color:#475569}.fun-card{margin:18px auto 0;position:relative;width:210px}.fun-card img{width:100%;display:block}.bubble{background:#fffaf0;border:2px solid #ffd77a;border-radius:18px;padding:12px 10px;font-weight:900;color:#1769d3;box-shadow:0 6px 14px #d18b0015;margin-bottom:10px}.bubble:after{content:"";display:block;width:16px;height:16px;background:#fffaf0;border-right:2px solid #ffd77a;border-bottom:2px solid #ffd77a;transform:rotate(45deg);margin:4px auto -21px}.sticker-row{display:flex;justify-content:center;gap:8px;font-size:1.7rem;margin-top:6px}.center{display:flex;flex-direction:column;align-items:center}.status{min-width:300px;text-align:center;border:1px solid #d8dee8;border-radius:14px;background:#fff;padding:15px 25px;font-size:1.28rem;font-weight:950;box-shadow:0 4px 12px #1720330c;margin-bottom:12px}.board{display:grid;width:min(68vh,720px,100%);aspect-ratio:1;border:2px solid #c9d2de;border-radius:14px;overflow:hidden;background:#c9d2de;gap:1px;box-shadow:0 8px 20px #17203312}.cell{border:0;background:#fff;display:grid;place-items:center;padding:4px;cursor:pointer;min-width:0;min-height:0}.cell:hover:not(:disabled){background:#fff7fa}.cell:disabled{cursor:default}.piece{width:78%;height:78%;border-radius:50%;object-fit:cover;border:2px solid #1771ea;box-shadow:0 2px 6px #17203320}.piece.o{border-color:#ef334f}.cell.win{background:#fff0ad}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:13px}.action{border-radius:13px;padding:12px 23px;font-weight:950;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ff477d,#ff3974);color:#fff;box-shadow:0 6px 14px #ff477d35}.secondary{border:1px solid #d6dce5;background:#fff;color:#374151}.sound.on{color:#16a34a;border-color:#9ce0af}.info{text-align:center;margin-top:8px;color:#64748b;font-size:.82rem}.qa-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.qa-mini img{width:100%;border-radius:16px;border:1px solid #ffd1df;background:#fff;box-shadow:0 5px 12px #ff477d10}
@media(max-width:980px){.arena{grid-template-columns:150px minmax(320px,1fr) 170px}.avatar{width:78px;height:78px}.score{width:130px}.fun-card{width:150px}.player-head{font-size:2rem}}@media(max-width:760px){.top{grid-template-columns:1fr}.top .ghost{display:none}.main-controls{grid-template-columns:1fr}.group+.group{border-left:0;border-top:1px solid #eee;padding-top:10px;margin-top:10px}.arena{grid-template-columns:1fr 1fr;gap:8px}.center{grid-column:1/-1;grid-row:2}.side{display:flex;flex-direction:column;align-items:center}.fun-card,.qa-mini{display:none}.avatar{width:62px;height:62px}.player-head{font-size:1.5rem}.score{margin:7px auto;width:105px;padding:8px}.score .big{font-size:1.6rem}.status{min-width:0;width:100%;padding:11px;margin:4px 0 10px}.board{width:94vw}.option{padding:8px 10px;min-width:58px}.app{width:98vw}}
</style></head><body><main class="app"><div class="top"><button id="themeBtn" class="ghost">☀ Chủ đề</button><div class="title"><h1>⭐ <span class="blue">CỜ</span> <span class="pink">CARO</span> ⭐</h1><p>Chơi vui vẻ và rèn luyện tư duy!</p></div><button id="helpBtn" class="ghost">❔ Hướng dẫn</button></div>
<section class="controls"><div class="main-controls"><div class="group"><div class="label">LUẬT THẮNG</div><div class="options"><button class="option rule active" data-v="3">3 QUÂN</button><button class="option rule" data-v="5">5 QUÂN</button></div></div><div class="group"><div class="label">KÍCH THƯỚC BÀN CỜ</div><div class="options"><button class="option grid" data-v="3">3×3</button><button class="option grid active" data-v="7">7×7</button><button class="option grid" data-v="10">10×10</button><button class="option grid" data-v="15">15×15</button></div></div><div class="group"><div class="label">ĐỐI THỦ</div><div class="options"><button class="option opponent active" data-v="human">2 NGƯỜI</button><button class="option opponent" data-v="computer">VỚI MÁY</button></div></div></div><div class="sub-controls"><div class="group"><div class="label">AI ĐI TRƯỚC?</div><div class="options"><button class="option starter active" data-v="X">X (Ba Cương)</button><button class="option starter" data-v="O">O (Quỳnh Anh)</button></div></div></div></section>
<section class="arena"><aside class="side side-x"><div class="player-head"><img class="avatar" src="assets/player-x.svg" alt="Ba Cương"><span class="x">X</span></div><div class="score"><div><span class="star x">★</span> <span id="scoreX" class="big x">0</span></div><small>sao · Ba Cương</small></div><div class="fun-card"><div class="bubble">🔊 Tới lượt<br>ba Cương</div><div class="sticker-row">🦖 🚀 ⚽</div></div></aside>
<div class="center"><div id="status" class="status"></div><div id="board" class="board"></div><div class="actions"><button id="soundBtn" class="action secondary sound">🔇 Âm thanh</button><button id="reset" class="action primary">↻ &nbsp; CHƠI LẠI</button><button id="clearScore" class="action secondary">☆ Đặt lại sao</button></div><div id="info" class="info"></div></div>
<aside class="side side-o"><div class="player-head"><span class="o">O</span><img class="avatar" src="assets/player-o.svg" alt="Quỳnh Anh"></div><div class="score"><div><span class="star o">★</span> <span id="scoreO" class="big o">999</span></div><small>sao · Quỳnh Anh</small></div><div class="fun-card"><img src="assets/quynh-crown.svg" alt="Quỳnh Anh đội vương miện"><div class="sticker-row">💖 ✨ 👑 🌈</div></div><div class="qa-mini"><img src="assets/quynh-star.svg" alt="Quỳnh Anh ngôi sao"><img src="assets/player-o.svg" alt="Quỳnh Anh"></div></aside></section></main>
<script>
const XIMG='assets/player-x.svg',OIMG='assets/player-o.svg',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],boardEl=$('#board'),statusEl=$('#status'),infoEl=$('#info'),scoreXEl=$('#scoreX'),scoreOEl=$('#scoreO'),soundBtn=$('#soundBtn');let winLength=3,size=7,opponent='human',starter='X',board=[],current='X',playing=true,winning=[],thinking=false,soundOn=false,scores={X:0,O:999};
function select(c,v){$$('.'+c).forEach(b=>b.classList.toggle('active',b.dataset.v==v))}function speak(text){if(!soundOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.94;window.speechSynthesis.speak(u)}function speakTurn(){if(!playing||thinking)return;speak(current==='X'?'Tới lượt ba Cương':'Tới lượt Quỳnh Anh')}function updateScores(){scoreXEl.textContent=scores.X;scoreOEl.textContent=scores.O}
function start(announce=true){if(size<winLength){size=winLength;select('grid',size)}board=Array(size*size).fill('');current=starter;playing=true;winning=[];thinking=false;boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;update();render();if(opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,350)}else if(announce)setTimeout(speakTurn,100)}
function update(){if(playing)statusEl.innerHTML=opponent==='computer'?(current==='X'?'Lượt của: <span class="x">X (Ba Cương)</span>':'🤖 Máy đang nghĩ...'):`Lượt của: <span class="${current==='X'?'x':'o'}">${current==='X'?'X (Ba Cương)':'O (Quỳnh Anh)'}</span>`;infoEl.textContent=`Bàn ${size}×${size} · Xếp ${winLength} quân liên tiếp để thắng`}
function render(){boardEl.innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(winning.includes(i)?' win':'');if(v){let im=document.createElement('img');im.src=v==='X'?XIMG:OIMG;im.className='piece'+(v==='O'?' o':'');im.alt=v;b.appendChild(im)}b.disabled=!playing||thinking||!!v||(opponent==='computer'&&current==='O');b.onclick=()=>humanMove(i);boardEl.appendChild(b)})}
function humanMove(i){if(!playing||thinking||board[i]||(opponent==='computer'&&current==='O'))return;place(i,current);if(playing&&opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,320)}}
function place(i,p){board[i]=p;winning=findWin(i,p);if(winning.length){playing=false;scores[p]++;updateScores();statusEl.textContent=p==='X'?'🎉 Ba Cương thắng!':'🎉 Quỳnh Anh thắng!';speak(p==='X'?'Ba Cương thắng rồi!':'Quỳnh Anh thắng rồi!')}else if(board.every(Boolean)){playing=false;statusEl.textContent='🤝 Hòa!';speak('Hòa rồi!')}else{current=p==='X'?'O':'X';update();setTimeout(speakTurn,80)}render()}
function computerMove(){if(!playing)return;let m=immediate('O')??immediate('X');if(m==null)m=(size===3&&winLength===3)?miniMove():heuristic();thinking=false;if(m!=null)place(m,'O')}function immediate(p){for(let i=0;i<board.length;i++)if(!board[i]){board[i]=p;let w=findWin(i,p).length;board[i]='';if(w)return i}return null}
function miniMove(){let best=-99,arr=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';let s=minimax(false);board[i]='';if(s>best){best=s;arr=[i]}else if(s===best)arr.push(i)}return arr[Math.floor(Math.random()*arr.length)]}function minimax(max){let r=eval3();if(r!==null)return r;let best=max?-99:99;for(let i=0;i<9;i++)if(!board[i]){board[i]=max?'O':'X';let s=minimax(!max);board[i]='';best=max?Math.max(best,s):Math.min(best,s)}return best}function eval3(){for(let p of ['X','O'])for(let i=0;i<9;i++)if(board[i]===p&&findWin(i,p).length)return p==='O'?10:-10;return board.every(Boolean)?0:null}
function heuristic(){let c=[];for(let i=0;i<board.length;i++)if(!board[i]&&neighbor(i))c.push(i);if(!c.length)return Math.floor(size/2)*size+Math.floor(size/2);let best=-Infinity,a=[];for(let i of c){let s=score(i,'O')*1.12+score(i,'X');if(s>best){best=s;a=[i]}else if(s===best)a.push(i)}return a[Math.floor(Math.random()*a.length)]}function neighbor(i){let r=Math.floor(i/size),c=i%size;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc])return true}return false}function score(i,p){let r=Math.floor(i/size),c=i%size,t=0;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1,o=0;for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){n++;rr+=dr*sg;cc+=dc*sg}if(rr>=0&&rr<size&&cc>=0&&cc<size&&!board[rr*size+cc])o++}t+=Math.pow(8,n)+o*n*6}return t}
function findWin(i,p){let r=Math.floor(i/size),c=i%size;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let line=[i];for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){sg<0?line.unshift(rr*size+cc):line.push(rr*size+cc);rr+=dr*sg;cc+=dc*sg}}if(line.length>=winLength){let pos=line.indexOf(i),st=Math.max(0,pos-winLength+1);if(st+winLength>line.length)st=line.length-winLength;return line.slice(st,st+winLength)}}return []}
$$('.opponent').forEach(b=>b.onclick=()=>{opponent=b.dataset.v;select('opponent',opponent);start()});$$('.rule').forEach(b=>b.onclick=()=>{winLength=+b.dataset.v;select('rule',winLength);if(size<winLength)size=winLength;start()});$$('.grid').forEach(b=>b.onclick=()=>{let n=+b.dataset.v;if(n<winLength)return;size=n;select('grid',size);start()});$$('.starter').forEach(b=>b.onclick=()=>{starter=b.dataset.v;select('starter',starter);start()});$('#reset').onclick=()=>start();$('#clearScore').onclick=()=>{scores={X:0,O:999};updateScores();start(false)};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.classList.toggle('on',soundOn);soundBtn.textContent=soundOn?'🔊 Âm thanh ON':'🔇 Âm thanh';if(soundOn)speakTurn();else if('speechSynthesis'in window)window.speechSynthesis.cancel()};$('#helpBtn').onclick=()=>alert('Chọn luật thắng, kích thước bàn cờ và người đi trước. Xếp đủ số quân theo hàng ngang, dọc hoặc chéo để thắng.');$('#themeBtn').onclick=()=>document.body.classList.toggle('alt');updateScores();start(false);
</script></body></html>
