<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cờ Caro</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff,#f7f9fc);color:#111827}.app{width:min(1180px,96vw);margin:auto;padding:16px 0 24px}.top{display:grid;grid-template-columns:120px 1fr 120px;align-items:start}.title h1{margin:0;text-align:center;font-size:clamp(2.2rem,5vw,4rem);line-height:1;font-weight:900}.title p{margin:7px 0 14px;text-align:center;color:#4b5563}.ghost{border:1px solid #d7dce5;background:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;border:1px solid #dce1e9;border-radius:16px;background:#fff;box-shadow:0 4px 16px #1720330c;padding:12px 14px;gap:12px}.group{padding:0 14px}.group+.group{border-left:1px solid #e5e7eb}.group-label{font-size:.82rem;font-weight:900;text-align:center;margin-bottom:8px}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.option{border:1px solid #d7dce5;background:#fff;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;min-width:76px}.option.active{background:#1769e8;color:#fff;border-color:#1769e8;box-shadow:0 4px 12px #1769e833}.subcontrols{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px auto 0}.mini{display:flex;align-items:center;gap:8px;border:1px solid #dce1e9;background:#fff;border-radius:12px;padding:7px 10px}.mini strong{font-size:.8rem}.mini .option{padding:7px 12px;min-width:54px}.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:18px auto 14px;max-width:920px}.playerbox{display:flex;align-items:center;justify-content:center;gap:12px}.playerbox.o{flex-direction:row-reverse}.player{display:flex;align-items:center;gap:12px;font-size:2rem;font-weight:900}.player.o{flex-direction:row-reverse}.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #1769e8;box-shadow:0 4px 16px #17203318}.player.o .avatar{border-color:#ef4444}.x{color:#1769e8}.oMark{color:#ef4444}.score{min-width:92px;border:1px solid #dbe4f2;border-radius:14px;background:#fff;padding:8px 12px;text-align:center;font-weight:900}.score .star{font-size:1.5rem}.score.xscore{color:#1769e8}.score.oscore{color:#ef4444}.score small{display:block;color:#4b5563;font-size:.75rem;margin-top:2px}.status{min-width:250px;text-align:center;border:1px solid #d8dee8;border-radius:13px;background:#fff;padding:15px 24px;font-size:1.25rem;font-weight:900;box-shadow:0 3px 10px #1720330b}.board-wrap{display:flex;justify-content:center;overflow:auto}.board{display:grid;width:min(68vh,720px,94vw);aspect-ratio:1;border:2px solid #cfd6e1;border-radius:14px;overflow:hidden;background:#cfd6e1;gap:1px}.cell{border:0;background:#fff;display:grid;place-items:center;padding:4px;cursor:pointer;min-width:0;min-height:0}.cell:hover:not(:disabled){background:#f5f8ff}.cell:disabled{cursor:default}.piece{width:78%;height:78%;border-radius:50%;object-fit:cover;border:2px solid #1769e8;box-shadow:0 2px 6px #17203320}.piece.o{border-color:#ef4444}.cell.win{background:#fff4bf}.actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}.action{border:0;border-radius:12px;padding:12px 24px;font-weight:900;font-size:1rem;cursor:pointer}.primary{background:#1769e8;color:#fff;box-shadow:0 6px 14px #1769e833}.secondary{background:#fff;border:1px solid #d7dce5;color:#374151}#info{text-align:center;margin-top:9px;font-size:.82rem;color:#6b7280}@media(max-width:760px){.top{grid-template-columns:1fr}.top>.ghost{display:none}.controls{grid-template-columns:1fr}.group+.group{border-left:0;border-top:1px solid #e5e7eb;padding-top:10px}.players{grid-template-columns:1fr 1fr;gap:8px}.status{grid-column:1/-1;grid-row:2;min-width:0;padding:11px}.avatar{width:58px;height:58px}.player{font-size:1.35rem;gap:6px}.score{min-width:70px;padding:6px 8px}.score .star{font-size:1.15rem}.option{padding:9px 11px;min-width:62px}.playerbox{gap:6px}.board{width:94vw}}</style></head><body><main class="app"><div class="top"><button id="soundBtn" class="ghost">🔇 Âm thanh</button><div class="title"><h1>⭐ CỜ CARO ⭐</h1><p>Chơi vui vẻ và rèn luyện tư duy!</p></div><button class="ghost">❔ Hướng dẫn</button></div><section class="controls"><div class="group"><div class="group-label">LUẬT THẮNG</div><div class="options"><button class="option rule active" data-v="3">3 QUÂN</button><button class="option rule" data-v="5">5 QUÂN</button></div></div><div class="group"><div class="group-label">KÍCH THƯỚC BÀN CỜ</div><div class="options"><button class="option grid" data-v="3">3×3</button><button class="option grid active" data-v="7">7×7</button><button class="option grid" data-v="10">10×10</button><button class="option grid" data-v="15">15×15</button></div></div><div class="group"><div class="group-label">ĐỐI THỦ</div><div class="options"><button class="option opponent active" data-v="human">2 NGƯỜI</button><button class="option opponent" data-v="computer">VỚI MÁY</button></div></div></section><div class="subcontrols"><div class="mini"><strong>ĐI TRƯỚC:</strong><button class="option starter active" data-v="X">X</button><button class="option starter" data-v="O">O</button></div></div><section class="players"><div class="playerbox"><div class="player"><img class="avatar" src="assets/player-x.svg" alt="Ba Cương"><span class="x">X</span></div><div class="score xscore"><span class="star">★</span> <span id="scoreX">0</span><small>Thắng</small></div></div><div id="status" class="status"></div><div class="playerbox o"><div class="player o"><img class="avatar" src="assets/player-o.svg" alt="Quỳnh Anh"><span class="oMark">O</span></div><div class="score oscore"><span class="star">★</span> <span id="scoreO">0</span><small>Thắng</small></div></div></section><div class="board-wrap"><div id="board" class="board"></div></div><div class="actions"><button id="reset" class="action primary">↻ &nbsp; CHƠI LẠI</button><button id="clearScore" class="action secondary">☆ Xóa điểm</button></div><div id="info"></div></main><script>const XIMG='assets/player-x.svg',OIMG='assets/player-o.svg',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],boardEl=$('#board'),statusEl=$('#status'),infoEl=$('#info'),scoreXEl=$('#scoreX'),scoreOEl=$('#scoreO'),soundBtn=$('#soundBtn');let winLength=3,size=7,opponent='human',starter='X',board=[],current='X',playing=true,winning=[],thinking=false,soundOn=false,scores={X:0,O:0};function select(c,v){$$('.'+c).forEach(b=>b.classList.toggle('active',b.dataset.v==v))}function speakTurn(){if(!soundOn||!playing||thinking||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let text=current==='X'?'Tới lượt ba Cương':'Tới lượt Quỳnh Anh';let u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;window.speechSynthesis.speak(u)}function updateScores(){scoreXEl.textContent=scores.X;scoreOEl.textContent=scores.O}function start(announce=true){if(size<winLength){size=winLength;select('grid',size)}board=Array(size*size).fill('');current=starter;playing=true;winning=[];thinking=false;boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;update();render();if(opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,350)}else if(announce)speakTurn()}function update(){if(playing)statusEl.innerHTML=opponent==='computer'?(current==='X'?'Lượt của: <span class="x">X</span>':'🤖 Máy đang nghĩ...'):`Lượt của: <span class="${current==='X'?'x':'oMark'}">${current}</span>`;infoEl.textContent=`Bàn ${size}×${size} · Xếp ${winLength} quân liên tiếp để thắng`}function render(){boardEl.innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.className='cell'+(winning.includes(i)?' win':'');if(v){let im=document.createElement('img');im.src=v==='X'?XIMG:OIMG;im.className='piece'+(v==='O'?' o':'');im.alt=v;b.appendChild(im)}b.disabled=!playing||thinking||!!v||(opponent==='computer'&&current==='O');b.onclick=()=>humanMove(i);boardEl.appendChild(b)})}function humanMove(i){if(!playing||thinking||board[i]||(opponent==='computer'&&current==='O'))return;place(i,current);if(playing&&opponent==='computer'&&current==='O'){thinking=true;update();render();setTimeout(computerMove,320)}}function place(i,p){board[i]=p;winning=findWin(i,p);if(winning.length){playing=false;scores[p]++;updateScores();statusEl.textContent=opponent==='computer'?(p==='X'?'🎉 Ba Cương thắng!':'🤖 Máy thắng!'):(p==='X'?'🎉 Ba Cương thắng!':'🎉 Quỳnh Anh thắng!');if(soundOn&&'speechSynthesis'in window){window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(p==='X'?'Ba Cương thắng rồi!':'Quỳnh Anh thắng rồi!');u.lang='vi-VN';window.speechSynthesis.speak(u)}}else if(board.every(Boolean)){playing=false;statusEl.textContent='🤝 Hòa!'}else{current=p==='X'?'O':'X';update();setTimeout(speakTurn,80)}render()}function computerMove(){if(!playing)return;let m=immediate('O')??immediate('X');if(m==null)m=(size===3&&winLength===3)?miniMove():heuristic();thinking=false;if(m!=null)place(m,'O')}function immediate(p){for(let i=0;i<board.length;i++)if(!board[i]){board[i]=p;let w=findWin(i,p).length;board[i]='';if(w)return i}return null}function miniMove(){let best=-99,arr=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';let s=minimax(false);board[i]='';if(s>best){best=s;arr=[i]}else if(s===best)arr.push(i)}return arr[Math.floor(Math.random()*arr.length)]}function minimax(max){let r=eval3();if(r!==null)return r;let best=max?-99:99;for(let i=0;i<9;i++)if(!board[i]){board[i]=max?'O':'X';let s=minimax(!max);board[i]='';best=max?Math.max(best,s):Math.min(best,s)}return best}function eval3(){for(let p of ['X','O'])for(let i=0;i<9;i++)if(board[i]===p&&findWin(i,p).length)return p==='O'?10:-10;return board.every(Boolean)?0:null}function heuristic(){let c=[];for(let i=0;i<board.length;i++)if(!board[i]&&neighbor(i))c.push(i);if(!c.length)return Math.floor(size/2)*size+Math.floor(size/2);let best=-Infinity,a=[];for(let i of c){let s=score(i,'O')*1.12+score(i,'X');if(s>best){best=s;a=[i]}else if(s===best)a.push(i)}return a[Math.floor(Math.random()*a.length)]}function neighbor(i){let r=Math.floor(i/size),c=i%size;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc])return true}return false}function score(i,p){let r=Math.floor(i/size),c=i%size,t=0;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1,o=0;for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){n++;rr+=dr*sg;cc+=dc*sg}if(rr>=0&&rr<size&&cc>=0&&cc<size&&!board[rr*size+cc])o++}t+=Math.pow(8,n)+o*n*6}return t}function findWin(i,p){let r=Math.floor(i/size),c=i%size;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let line=[i];for(let sg of [-1,1]){let rr=r+dr*sg,cc=c+dc*sg;while(rr>=0&&rr<size&&cc>=0&&cc<size&&board[rr*size+cc]===p){sg<0?line.unshift(rr*size+cc):line.push(rr*size+cc);rr+=dr*sg;cc+=dc*sg}}if(line.length>=winLength){let pos=line.indexOf(i),st=Math.max(0,pos-winLength+1);if(st+winLength>line.length)st=line.length-winLength;return line.slice(st,st+winLength)}}return []}$$('.opponent').forEach(b=>b.onclick=()=>{opponent=b.dataset.v;select('opponent',opponent);start()});$$('.rule').forEach(b=>b.onclick=()=>{winLength=+b.dataset.v;select('rule',winLength);if(size<winLength)size=winLength;start()});$$('.grid').forEach(b=>b.onclick=()=>{let n=+b.dataset.v;if(n<winLength)return;size=n;select('grid',size);start()});$$('.starter').forEach(b=>b.onclick=()=>{starter=b.dataset.v;select('starter',starter);start()});$('#reset').onclick=()=>start();$('#clearScore').onclick=()=>{scores={X:0,O:0};updateScores();start(false)};soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Âm thanh':'🔇 Âm thanh';if(soundOn)speakTurn();else if('speechSynthesis'in window)window.speechSynthesis.cancel()};updateScores();start(false);</script></body></html>
